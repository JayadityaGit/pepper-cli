name: contract-sync

# Keeps contracts/api-v1.openapi.json in step with the server's published schema. Weekly (and on
# demand) it downloads the snapshot artifact from the latest successful main CI run of the
# server repo and, when the vendored copy differs, opens or updates a single PR on the fixed
# branch `contract-sync`.
#
# The server repo is private, so the default GITHUB_TOKEN cannot read it. A repository secret,
# PEPPER_CONTRACT_READ_TOKEN (fine-grained, Actions: read on the server repo), is used for the
# download step ONLY. Pushing the branch and opening the PR use the job's own GITHUB_TOKEN. With
# no secret configured the job succeeds with a notice and does nothing.
#
# Security posture (this workflow can write, so keep it this way):
# - Triggers are `schedule` and `workflow_dispatch` only. Never add `pull_request`,
#   `pull_request_target` or `workflow_run`: nothing a fork controls may reach this job.
# - It always works from `main`. A manual run started from any other branch is skipped, and the
#   checkout names `main` explicitly, so the sync branch is always `main` plus one commit.
# - No step runs code from the repository or from the artifact. The artifact is untrusted input:
#   it is downloaded into an empty temp directory, exactly one file name is read from it, and
#   that file must be a regular file of sane size holding an OpenAPI JSON object before it is
#   copied to the one vendored path.
# - The checkout does not persist credentials. Each token is in the env of exactly one step.
# - The only ref ever pushed is the fixed bot branch `contract-sync` (force-pushed in place).

on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: contract-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync the vendored snapshot
    # Scheduled runs always carry the default branch. A manual run from another branch is skipped
    # rather than building the sync branch from that branch's commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the fixed `contract-sync` branch
      pull-requests: write # open the sync PR
    env:
      SERVER_REPO: Vycari/pepper
      SYNC_BRANCH: contract-sync
      VENDORED: contracts/api-v1.openapi.json
    steps:
      # Only a boolean reaches this step; the token itself is not in its environment.
      - name: Check for the read token
        id: gate
        env:
          READ_TOKEN_SET: ${{ secrets.PEPPER_CONTRACT_READ_TOKEN != '' }}
        run: |
          if [ "$READ_TOKEN_SET" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PEPPER_CONTRACT_READ_TOKEN is not set; skipping contract sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Always `main`, whatever ref started the run. No credentials are left in .git/config; the
      # last step authenticates its own push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: main
          persist-credentials: false

      # The only step that sees the read token. It runs `gh` and nothing from the repository.
      - name: Download the latest server snapshot
        id: download
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.PEPPER_CONTRACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$SERVER_REPO" --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::notice::No successful ci.yml run found on $SERVER_REPO main; nothing to sync."
            exit 0
          fi
          case "$run_id" in
            *[!0-9]*)
              echo "::error::Unexpected run id from the server repo."
              exit 1
              ;;
          esac
          download_dir="$(mktemp -d "$RUNNER_TEMP/contract-download.XXXXXX")"
          gh run download "$run_id" --repo "$SERVER_REPO" --name api-v1-openapi \
            --dir "$download_dir"
          echo "Downloaded snapshot from server run $run_id."
          echo "dir=$download_dir" >> "$GITHUB_OUTPUT"

      # No token here. The artifact is untrusted: read one fixed file name from the download
      # directory, and require a regular file (not a symlink) of sane size that parses as an
      # OpenAPI JSON object with schemas. A present-but-wrong artifact fails the run so a person
      # sees it; it is never copied into the repository.
      - name: Validate the downloaded snapshot
        id: validate
        if: steps.download.outputs.dir != ''
        env:
          DOWNLOAD_DIR: ${{ steps.download.outputs.dir }}
        run: |
          set -euo pipefail
          src="$DOWNLOAD_DIR/api-v1.openapi.json"
          if [ -L "$src" ] || [ ! -f "$src" ]; then
            echo "::error::The artifact does not contain a regular file api-v1.openapi.json."
            exit 1
          fi
          size="$(wc -c < "$src")"
          if [ "$size" -lt 1024 ] || [ "$size" -gt 20971520 ]; then
            echo "::error::Snapshot size $size bytes is outside the expected range (1 KiB to 20 MiB)."
            exit 1
          fi
          if ! jq -e '
            type == "object"
            and (.openapi | type == "string")
            and (.paths | type == "object" and length > 0)
            and (.components.schemas | type == "object" and length > 0)
          ' "$src" > /dev/null; then
            echo "::error::Snapshot is not an OpenAPI JSON object with paths and schemas."
            exit 1
          fi
          if cmp -s "$src" "$VENDORED"; then
            echo "Vendored snapshot is up to date."
            exit 0
          fi
          echo "src=$src" >> "$GITHUB_OUTPUT"

      # The only step that sees the job token, and the only one that writes. It commits the one
      # vendored file on top of `main` and pushes the one fixed branch.
      - name: Open or update the sync PR
        if: steps.validate.outputs.src != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ steps.validate.outputs.src }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          cp -- "$SRC" "$VENDORED"
          git add -- "$VENDORED"
          git commit -m "chore(contract): refresh the vendored /api/v1 snapshot"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${SYNC_BRANCH}"
          # Same-repository PRs only: a fork's branch that happens to share the name must not
          # be mistaken for the sync PR.
          existing="$(gh pr list --head "$SYNC_BRANCH" --base main --state open \
            --json number,isCrossRepository \
            -q 'map(select(.isCrossRepository | not)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated the existing contract-sync PR #$existing."
          else
            gh pr create --head "$SYNC_BRANCH" --base main \
              --title "chore(contract): refresh the vendored /api/v1 snapshot" \
              --body "Automated refresh of contracts/api-v1.openapi.json from the server repo's latest successful main CI run. Do not hand-edit the snapshot; if the contract test fails, the CLI mirrors need updating to match the server. This branch is force-pushed by the next sync, so put follow-up changes in a separate PR."
          fi
