name: contract-sync

# Keeps contracts/api-v1.openapi.json in step with the server's published schema. Weekly (and on
# demand) it downloads the snapshot artifact from the latest successful main CI run of the
# server repo and, when the vendored copy differs, opens or updates a single PR on the fixed
# branch `contract-sync`.
#
# The server repo is private, so the default GITHUB_TOKEN cannot read it. A repository secret,
# PEPPER_CONTRACT_READ_TOKEN (fine-grained, Actions: read on the server repo), is used for the
# download step ONLY. Pushing the branch and opening the PR use the job's own GITHUB_TOKEN. With
# no secret configured the job succeeds with a notice and does nothing.

on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: contract-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync the vendored snapshot
    runs-on: ubuntu-latest
    # Job-scoped: contents to push the sync branch, pull-requests to open the PR.
    permissions:
      contents: write
      pull-requests: write
    env:
      SERVER_REPO: Vycari/pepper
      SYNC_BRANCH: contract-sync
    steps:
      - name: Check for the read token
        id: gate
        env:
          READ_TOKEN: ${{ secrets.PEPPER_CONTRACT_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::notice::PEPPER_CONTRACT_READ_TOKEN is not set; skipping contract sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Credentials are persisted here (and only here) because the last step pushes the branch.
      # Nothing before it runs untrusted input: the downloaded artifact is only copied, never
      # executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: true

      - name: Download the latest server snapshot
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.PEPPER_CONTRACT_READ_TOKEN }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$SERVER_REPO" --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "::notice::No successful ci.yml run found on $SERVER_REPO main; nothing to sync."
            exit 0
          fi
          gh run download "$run_id" --repo "$SERVER_REPO" --name api-v1-openapi \
            --dir "$RUNNER_TEMP_DIR/contract"
          echo "Downloaded snapshot from server run $run_id."

      - name: Open or update the sync PR
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP_DIR/contract/api-v1.openapi.json"
          dest="contracts/api-v1.openapi.json"
          if [ ! -f "$src" ]; then
            echo "::notice::No snapshot was downloaded; nothing to sync."
            exit 0
          fi
          if cmp -s "$src" "$dest"; then
            echo "Vendored snapshot is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          cp "$src" "$dest"
          git add "$dest"
          git commit -m "chore(contract): refresh the vendored /api/v1 snapshot"
          git push --force origin "$SYNC_BRANCH"
          if [ -n "$(gh pr list --head "$SYNC_BRANCH" --state open --json number -q '.[0].number')" ]; then
            echo "Updated the existing contract-sync PR."
          else
            gh pr create --head "$SYNC_BRANCH" --base main \
              --title "chore(contract): refresh the vendored /api/v1 snapshot" \
              --body "Automated refresh of contracts/api-v1.openapi.json from the server repo's latest successful main CI run. Do not hand-edit the snapshot; if the contract test fails, the CLI mirrors need updating to match the server."
          fi
