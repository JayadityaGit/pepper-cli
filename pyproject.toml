[project]
name = "pepper-cli"
version = "0.0.1"
description = "Command-line client for Pepper — bearer-token API access to /api/v1/."
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Allen Hutchison" }]
# Deliberately narrow. The CLI is also the de-facto API contract that
# future iOS/Android clients will port from, so anything that creeps in
# here either needs a portable analog or has to leave.
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0.53",
    "pyyaml>=6.0",
    # IANA zone data for ``zoneinfo`` on Windows, which ships none: "today" is
    # the account's date (``next_view.user_now``), and without it every
    # non-UTC account silently falls back to UTC. Pure data, no build step.
    "tzdata; sys_platform == 'win32'",
    # Cosmetic (names the process ``pepper``; see ``proctitle.py``), and a
    # C extension — so only where setproctitle 1.3.7 ships a wheel for
    # CPython 3.13/3.14: macOS (universal2 + arm64) and Linux
    # x86_64/aarch64/ppc64le (glibc + musl). Anywhere else a mandatory
    # dependency would fall back to an sdist build that fails without a
    # compiler and blocks install; the lazy import in ``proctitle`` just
    # skips the rename instead. Widen the Python bound once a release ships
    # 3.15 wheels.
    "setproctitle>=1.3.7; platform_python_implementation == 'CPython' and python_version < '3.15' and (sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'ppc64le')))",
]

[project.scripts]
# ``uv sync`` puts ``pepper`` on PATH in the workspace venv. Once
# published the same script wires up after ``pip install pepper-cli``.
pepper = "pepper_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.16.10",
    "ty>=0.0.85,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepper_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

# Inherit the root package's `select = ["ALL"]` posture and its ignore list so
# the two packages can't drift — `extend` layers this file on top of the root
# config rather than replacing it. Only CLI-specific deviations belong below.
[tool.ruff]
extend = "../../pyproject.toml"
line-length = 100
target-version = "py313"

# `extend-per-file-ignores` *adds* to the root config's table; a plain
# `per-file-ignores` here would replace it and drop the shared test ignores.
[tool.ruff.lint.extend-per-file-ignores]
# A terminal client prints — that's the interface, not a debug leftover.
"src/pepper_cli/**" = ["T201"]

# Static type checking — mirrors the root package's lenient `ty` baseline
# (#807). Existing findings are suppressed inline with `# ty: ignore[...]`;
# new type errors fail the CLI CI job. Regenerate with
# `uv run --no-sync ty check --add-ignore src/pepper_cli/` from this dir.
[tool.ty.environment]
python-version = "3.13"
